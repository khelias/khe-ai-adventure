name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A push to main is never cancelled: publish must not stop between moving the
# proxy's main tag and the web's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: UI smoke
        run: npm run ui:smoke

      - name: Schema hash check
        run: npm run schema:hashes

      - name: Proxy syntax check
        run: node --check proxy/server.js && node --check proxy/limits.js && node --check proxy/gemini-response.js

  # The required check. Read-only, so the scanner never runs where a token can
  # write packages.
  images:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proxy
          load: true
          tags: khe-ai-adventure-proxy:ci
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      - name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: khe-ai-adventure-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Grype's ignore rules have no expiry of their own (estate ADR-008).
      - name: Check scan ignore rules have not expired
        run: |
          # Read first, so a missing yq or a broken file fails the step
          # instead of yielding no rules.
          rules=$(yq '.ignore | length' .grype.yaml)
          if [ "$rules" -eq 0 ]; then exit 0; fi
          reasons=$(yq -r '.ignore[] | .reason // ""' .grype.yaml)
          today=$(date -u +%F)
          status=0
          while IFS= read -r reason; do
            case $reason in
              "until "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]:*) ;;
              *)
                echo "::error file=.grype.yaml::ignore rule reason must start with 'until YYYY-MM-DD:': $reason"
                status=1
                continue
                ;;
            esac
            until=${reason#until }
            until=${until%%:*}
            if [[ "$until" < "$today" ]]; then
              echo "::error file=.grype.yaml::ignore rule expired on $until: $reason"
              status=1
            fi
          done <<< "$reasons"
          exit "$status"

      - name: Export images for the scanner
        run: |
          docker save -o proxy.tar khe-ai-adventure-proxy:ci
          docker save -o web.tar khe-ai-adventure-web:ci

      - name: Scan proxy
        uses: docker://anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3
        env:
          GRYPE_DB_CACHE_DIR: .grype-db
        with:
          args: docker-archive:proxy.tar

      - name: Scan web
        uses: docker://anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3
        env:
          GRYPE_DB_CACHE_DIR: .grype-db
        with:
          args: docker-archive:web.tar

  # The only job that can write packages or mint an OIDC token (estate ADR-008).
  # It builds with no cache: the gha cache can be written by any step holding
  # the runner's cache token, the scanner container and npm scripts included.
  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    outputs:
      moved: ${{ steps.move.outputs.moved }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE_BASE: ghcr.io/khelias/khe-ai-adventure

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A re-run of an older commit must not move main backwards.
      - name: Stop unless this commit is still main's tip
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $tip, not $GITHUB_SHA; nothing is published from this run"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A sha- tag is never overwritten, so a rollback pin keeps its digest.
      # GHCR answers 403 for a package that does not exist yet.
      - name: Check for existing sha tags
        id: existing
        if: steps.tip.outputs.current == 'true'
        run: |
          for part in proxy web; do
            ref="$IMAGE_BASE-$part:sha-$GITHUB_SHA"
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "::notice::$ref already exists and is not rebuilt"
              echo "$part=true" >> "$GITHUB_OUTPUT"
            elif grep -qiE 'not found|403 forbidden|denied' <<<"$out"; then
              echo "$part=false" >> "$GITHUB_OUTPUT"
            else
              echo "$out" >&2
              exit 1
            fi
          done

      - name: Proxy metadata
        id: meta-proxy
        if: steps.existing.outputs.proxy == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_BASE }}-proxy
          flavor: latest=false
          tags: type=sha,format=long
          labels: org.opencontainers.image.title=khe-ai-adventure-proxy

      - name: Push proxy
        if: steps.existing.outputs.proxy == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          annotations: ${{ steps.meta-proxy.outputs.annotations }}
          no-cache: true
          sbom: true
          provenance: mode=max

      - name: Web metadata
        id: meta-web
        if: steps.existing.outputs.web == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_BASE }}-web
          flavor: latest=false
          tags: type=sha,format=long
          labels: org.opencontainers.image.title=khe-ai-adventure-web

      - name: Push web
        if: steps.existing.outputs.web == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          annotations: ${{ steps.meta-web.outputs.annotations }}
          no-cache: true
          sbom: true
          provenance: mode=max

      # Attests whatever sha- digest lacks an attestation, including one pushed
      # by an earlier attempt whose attest step failed; a re-run skips the push.
      - name: Find unattested digests
        id: attested
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for part in proxy web; do
            digest=$(docker buildx imagetools inspect "$IMAGE_BASE-$part:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            count=$(gh api "repos/$GITHUB_REPOSITORY/attestations/$digest" --jq '.attestations | length' 2>/dev/null || echo 0)
            echo "${part}_digest=$digest" >> "$GITHUB_OUTPUT"
            if [ "$count" -ge 1 ]; then echo "$part=true"; else echo "$part=false"; fi >> "$GITHUB_OUTPUT"
          done

      # Storage records exist only for organisation-owned repos; khelias is a
      # personal account.
      - name: Attest proxy
        if: steps.attested.outputs.proxy == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}-proxy
          subject-digest: ${{ steps.attested.outputs.proxy_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest web
        if: steps.attested.outputs.web == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}-web
          subject-digest: ${{ steps.attested.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false

      # Both main tags move in this one step, after both sha- tags exist, so a
      # reader sees the old pair or the new pair except for about a second.
      - name: Move both main tags
        id: move
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to $tip during this run; its own run moves the main tags"
            exit 0
          fi
          # A transient registry error between the two moves would leave a
          # mismatched pair until the next run.
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::attempt $attempt failed: $*"
              sleep $((attempt * 5))
            done
            return 1
          }
          attested() {
            digest=$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest)
            count=$(gh api "repos/$GITHUB_REPOSITORY/attestations/$digest" --jq '.attestations | length' 2>/dev/null || echo 0)
            [ "$count" -ge 1 ]
          }
          for part in proxy web; do
            if ! retry attested "$IMAGE_BASE-$part:sha-$GITHUB_SHA"; then
              echo "::error::$part sha-$GITHUB_SHA has no attestation; main is not moved"
              exit 1
            fi
          done
          for part in proxy web; do
            retry docker buildx imagetools create -t "$IMAGE_BASE-$part:main" "$IMAGE_BASE-$part:sha-$GITHUB_SHA"
          done
          for part in proxy web; do
            main=$(docker buildx imagetools inspect "$IMAGE_BASE-$part:main" --format '{{json .Manifest}}' | jq -r .digest)
            pinned=$(docker buildx imagetools inspect "$IMAGE_BASE-$part:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$main" != "$pinned" ]; then
              echo "::error::$part main is $main, sha-$GITHUB_SHA is $pinned"
              exit 1
            fi
            echo "- \`$IMAGE_BASE-$part:main@$main\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "moved=true" >> "$GITHUB_OUTPUT"

  # Opens the khe-homelab pin PR with auto-merge through the khe-adventure-pins
  # App (estate ADR-008). Its key is in the homelab-pin environment, which
  # only main can use; homelab's validate.yml limits what the App may change.
  pin:
    name: Pin homelab
    needs: publish
    if: needs.publish.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homelab-pin
    permissions:
      contents: read
    concurrency:
      group: pin-homelab
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE_BASE: ghcr.io/khelias/khe-ai-adventure

    steps:
      # secrets.* cannot appear in if:, so later steps gate on this output.
      - name: Check for the App secrets
        id: secrets
        env:
          CLIENT_ID: ${{ secrets.HOMELAB_PIN_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.HOMELAB_PIN_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::homelab-pin has no App secrets; the homelab pins are not moved"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # A re-run of an older commit must not pin backwards. Checking GHCR's
      # main rather than the branch tip also pins this commit when a newer one
      # landed meanwhile but has not published yet.
      - name: Stop unless GHCR main is this commit
        id: current
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          current=true
          for part in proxy web; do
            main=$(docker buildx imagetools inspect "$IMAGE_BASE-$part:main" --format '{{json .Manifest}}' | jq -r .digest)
            mine=$(docker buildx imagetools inspect "$IMAGE_BASE-$part:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$main" != "$mine" ]; then
              echo "::notice::$part main is $main, not sha-$GITHUB_SHA ($mine); a newer run pins"
              current=false
            fi
          done
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Mint the App token
        id: app
        if: steps.current.outputs.current == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMELAB_PIN_CLIENT_ID }}
          private-key: ${{ secrets.HOMELAB_PIN_PRIVATE_KEY }}
          owner: khelias
          repositories: khe-homelab
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout khe-homelab
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khelias/khe-homelab
          token: ${{ steps.app.outputs.token }}
          path: homelab

      # The noreply address is assembled here so no file carries it.
      - name: Commit as the App
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          domain=users.noreply.github.com
          git -C homelab config user.name "${SLUG}[bot]"
          git -C homelab config user.email "${id}+${SLUG}[bot]@${domain}"

      - name: Open the pin PR
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/pin-homelab.sh homelab "$GITHUB_SHA"

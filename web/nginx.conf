# Runs behind the games nginx in khe-homelab, which sets the security headers
# (HSTS, CSP and the rest). This server only sets caching.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # A redirect must not carry this container's port out through the edge.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /adventure/config.js {
        alias /tmp/adventure-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location /adventure/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /adventure {
        return 301 /adventure/;
    }

    location /adventure/ {
        try_files $uri $uri/ /adventure/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        return 404;
    }
}
